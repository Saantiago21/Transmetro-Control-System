<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Asignación de Turnos - Transmetro Guatemala</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
    <style>
        .btn-tm-green {
            background-color: var(--tm-green);
            color: white;
            font-weight: 700;
            border: none;
            border-radius: 8px;
        }
        .btn-tm-green:hover {
            background-color: var(--tm-green-dark);
            color: white;
        }
    </style>
</head>
<body>
    <header th:replace="~{fragments/layout :: topbar}"></header>
    <aside th:replace="~{fragments/layout :: sidebar('turnos')}"></aside>

    <main class="main-content">
        <section class="card-custom">
            <h5 class="fw-bold mb-3 text-dark"><i class="fa-solid fa-calendar-check me-2 text-success"></i> Control y Asignación de Turnos</h5>
            
            <!-- Formulario para Registrar / Asignar Turnos -->
            <form th:action="@{/turnos/guardar}" method="post" class="bg-light p-3 rounded-3 border mb-4">
                <input type="hidden" name="idAsignacion" th:value="${nuevoTurno.idAsignacion}" />
                
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label small fw-semibold">Piloto</label>
                        <select class="form-select form-select-sm" name="pilotoId" required>
                            <option value="">Seleccione piloto...</option>
                            <option th:each="p : ${pilotos}" th:value="${p.idPiloto}" th:selected="${nuevoTurno.piloto != null and nuevoTurno.piloto.idPiloto == p.idPiloto}" th:text="${p.nombre + ' ' + p.apellido}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small fw-semibold">Bus / Unidad</label>
                        <select class="form-select form-select-sm" name="busId" required>
                            <option value="">Seleccione bus...</option>
                            <option th:each="b : ${buses}" th:value="${b.id}" th:selected="${nuevoTurno.bus != null and nuevoTurno.bus.id == b.id}" th:text="${b.placa}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small fw-semibold">Ruta / Línea</label>
                        <select class="form-select form-select-sm" name="rutaId" required>
                            <option value="">Seleccione ruta...</option>
                            <option th:each="r : ${rutas}" th:value="${r.idRuta}" th:selected="${nuevoTurno.ruta != null and nuevoTurno.ruta.idRuta == r.idRuta}" th:text="${r.nombreRuta}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small fw-semibold">Fecha</label>
                        <input type="date" class="form-control form-control-sm" name="fechaTurno" required th:value="${nuevoTurno.fechaTurno}">
                    </div>
                    
                    <!-- Horario fijo optimizado -->
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">Horario del Turno</label>
                        <select class="form-select form-select-sm" name="horario" required>
                            <option value="">Seleccione horario...</option>
                            <option value="05:00 AM - 01:00 PM" th:selected="${nuevoTurno.horario == '05:00 AM - 01:00 PM'}"> Turno Mañana (05:00 AM - 01:00 PM)</option>
                            <option value="01:00 PM - 09:00 PM" th:selected="${nuevoTurno.horario == '01:00 PM - 09:00 PM'}"> Turno Tarde/Noche (01:00 PM - 09:00 PM)</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">Estado</label>
                        <select class="form-select form-select-sm" name="estado" required>
                            <option value="Programado" th:selected="${nuevoTurno.estado == 'Programado'}">Programado</option>
                            <option value="En Curso" th:selected="${nuevoTurno.estado == 'En Curso'}">En Curso</option>
                            <option value="Finalizado" th:selected="${nuevoTurno.estado == 'Finalizado'}">Finalizado</option>
                            <option value="Cancelado" th:selected="${nuevoTurno.estado == 'Cancelado'}">Cancelado</option>
                        </select>
                    </div>
                </div>
                
                <div class="mt-3 d-flex gap-2">
                    <button type="submit" class="btn btn-tm-green btn-sm fw-bold"><i class="fa-solid fa-floppy-disk me-1"></i> Asignar Turno</button>
                    <a th:if="${modoEdicion}" th:href="@{/turnos}" class="btn btn-secondary btn-sm">Cancelar</a>
                </div>
            </form>

            <!-- Tabla de Turnos Registrados -->
            <div class="table-responsive">
                <table class="table align-middle table-hover">
                    <thead class="table-light small">
                        <tr>
                            <th>ID Asignación</th>
                            <th>Piloto</th>
                            <th>Unidad</th>
                            <th>Ruta</th>
                            <th>Fecha</th>
                            <th>Horario</th>
                            <th>Estado</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="t : ${turnos}">
                            <td class="fw-bold text-secondary" th:text="${t.idAsignacion}">1</td>
                            <td class="fw-bold" th:text="${t.piloto != null ? t.piloto.nombre + ' ' + t.piloto.apellido : 'Piloto asignado'}">Piloto</td>
                            <td><span class="badge bg-success-subtle text-success border border-success-subtle" th:text="${t.bus != null ? t.bus.placa : 'Unidad'}">Bus</span></td>
                            <td th:text="${t.ruta != null ? t.ruta.nombreRuta : 'Ruta'}">Ruta</td>
                            <td th:text="${t.fechaTurno}">Fecha</td>
                            <td th:text="${t.horario}">Horario</td>
                            <td th:text="${t.estado}">Programado</td>
                            <td class="text-end">
                                <a th:href="@{/turnos/editar/{id}(id=${t.idAsignacion})}" class="btn btn-sm btn-outline-primary"><i class="fa-solid fa-pen"></i></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div th:replace="~{fragments/layout :: reportModal}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
