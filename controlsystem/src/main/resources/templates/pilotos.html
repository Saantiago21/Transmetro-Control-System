<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de Pilotos - Transmetro Guatemala</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
    <style>
        .btn-tm-green {
            background-color: var(--tm-green);
            color: white;
            font-weight: 700;
            border: none;
            border-radius: 8px;
        }
        .btn-tm-green:hover {
            background-color: var(--tm-green-dark);
            color: white;
        }
    </style>
</head>
<body>
    <header th:replace="~{fragments/layout :: topbar}"></header>
    <aside th:replace="~{fragments/layout :: sidebar('pilotos')}"></aside>

    <main class="main-content">
        <section class="card-custom">
            <h5 class="fw-bold mb-3 text-dark"><i class="fa-solid fa-id-card me-2 text-success"></i> Registro y Control de Pilotos</h5>

            <div th:if="${error}" class="alert alert-warning py-2" role="alert" th:text="${error}"></div>
            
            <!-- Formulario de Pilotos -->
            <form th:action="@{/pilotos/guardar}" th:object="${nuevoPiloto}" method="post" class="bg-light p-3 rounded-3 border mb-4">
                <input type="hidden" th:field="*{idPiloto}" />
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label small fw-semibold">DPI</label>
                        <input type="text" class="form-control form-control-sm" th:field="*{dpi}" required minlength="13" maxlength="13" pattern="[0-9]{13}" inputmode="numeric" placeholder="13 dígitos">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small fw-semibold">Nombre</label>
                        <input type="text" class="form-control form-control-sm" th:field="*{nombre}" required maxlength="100" placeholder="Ej. Carlos">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small fw-semibold">Apellido</label>
                        <input type="text" class="form-control form-control-sm" th:field="*{apellido}" required maxlength="100" placeholder="Ej. Mendoza">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small fw-semibold">Licencia</label>
                        <input type="text" class="form-control form-control-sm" th:field="*{licencia}" required maxlength="20" placeholder="Ej. A-123456">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small fw-semibold">Teléfono</label>
                        <input type="text" class="form-control form-control-sm" th:field="*{telefono}" maxlength="15" placeholder="5555-5555">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small fw-semibold">Estado</label>
                        <select class="form-select form-select-sm" th:field="*{estado}" required>
                            <option value="Activo">Activo</option>
                            <option value="Inactivo">Inactivo</option>
                            <option value="Suspendido">Suspendido</option>
                        </select>
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-tm-green btn-sm fw-bold"><i class="fa-solid fa-floppy-disk me-1"></i> Guardar Piloto</button>
                    <a th:if="${modoEdicion}" th:href="@{/pilotos}" class="btn btn-secondary btn-sm">Cancelar</a>
                </div>
            </form>

            <!-- Tabla de Pilotos -->
            <div class="table-responsive">
                <table class="table align-middle table-hover">
                    <thead class="table-light small">
                        <tr>
                            <th>Nombre Completo</th>
                            <th>DPI</th>
                            <th>Licencia</th>
                            <th>Teléfono</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${pilotos}">
                            <td class="fw-bold text-dark" th:text="${p.nombre + ' ' + p.apellido}">Nombre Piloto</td>
                            <td th:text="${p.dpi}">DPI</td>
                            <td><span class="badge bg-light text-dark border" th:text="${p.licencia}">Licencia</span></td>
                            <td th:text="${p.telefono}">Teléfono</td>
                            <td class="text-end">
                                <a th:href="@{/pilotos/editar/{id}(id=${p.idPiloto})}" class="btn btn-sm btn-outline-primary"><i class="fa-solid fa-pen"></i></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div th:replace="~{fragments/layout :: reportModal}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
