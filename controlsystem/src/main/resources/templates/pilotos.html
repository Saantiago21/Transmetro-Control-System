<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pilotos - Sistema Transmetro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="fa-solid fa-bus me-2"></i>Sistema Transmetro</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="fa-solid fa-users me-1"></i> Usuarios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/buses"><i class="fa-solid fa-bus me-1"></i> Buses</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/rutas"><i class="fa-solid fa-route me-1"></i> Rutas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-semibold" href="/pilotos"><i class="fa-solid fa-id-card me-1"></i> Pilotos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/turnos"><i class="fa-solid fa-calendar-check me-1"></i> Turnos</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        
        <!-- Formulario para Registrar / Editar Piloto -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white py-3">
                <h5 class="card-title text-primary m-0 fw-bold">
                    <i class="fa-solid fa-user-tie me-2"></i>
                    <span th:text="${nuevoPiloto.idPiloto != null} ? 'Editar Piloto' : 'Registrar Nuevo Piloto'">Registrar Nuevo Piloto</span>
                </h5>
            </div>
            <div class="card-body">
                <form th:action="${nuevoPiloto.idPiloto != null} ? @{/pilotos/actualizar/{id}(id=${nuevoPiloto.idPiloto})} : @{/pilotos/guardar}" th:object="${nuevoPiloto}" method="post" class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Nombre</label>
                        <input type="text" class="form-control" th:field="*{nombre}" placeholder="Ej. Carlos" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Apellido</label>
                        <input type="text" class="form-control" th:field="*{apellido}" placeholder="Ej. Morales" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Licencia</label>
                        <input type="text" class="form-control" th:field="*{licencia}" placeholder="Ej. A-1234567" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Teléfono</label>
                        <input type="text" class="form-control" th:field="*{telefono}" placeholder="Ej. 5555-4444">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Estado</label>
                        <select class="form-select" th:field="*{estado}" required>
                            <option value="" disabled selected>Seleccione estado...</option>
                            <option value="Activo">Activo</option>
                            <option value="Suspendido">Suspendido</option>
                            <option value="Vacaciones">Vacaciones</option>
                        </select>
                    </div>
                    <div class="col-12 text-end">
                        <a th:if="${nuevoPiloto.idPiloto != null}" th:href="@{/pilotos}" class="btn btn-secondary px-4 fw-semibold me-2">
                            <i class="fa-solid fa-xmark me-1"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">
                            <i class="fa-solid fa-floppy-disk me-1"></i> 
                            <span th:text="${nuevoPiloto.idPiloto != null} ? 'Actualizar Piloto' : 'Guardar Piloto'">Guardar Piloto</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Lista de Pilotos Registrados -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="card-title text-secondary m-0 fw-bold"><i class="fa-solid fa-id-card me-2"></i>Pilotos Registrados</h5>
                
                <!-- Búsqueda -->
                <form th:action="@{/pilotos}" method="get" class="d-flex" style="max-width: 300px;">
                    <input class="form-control form-control-sm me-2" type="search" name="keyword" th:value="${keyword}" placeholder="Buscar por nombre o licencia...">
                    <button class="btn btn-sm btn-outline-primary" type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
                </form>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle m-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-3">ID</th>
                                <th>Nombre Completo</th>
                                <th>Licencia</th>
                                <th>Teléfono</th>
                                <th>Estado</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${pilotos}">
                                <td class="ps-3 fw-bold" th:text="${p.idPiloto}">1</td>
                                <td class="fw-bold text-primary" th:text="${p.nombre} + ' ' + ${p.apellido}">Carlos Morales</td>
                                <td th:text="${p.licencia}">A-1234567</td>
                                <td th:text="${p.telefono}">5555-4444</td>
                                <td>
                                    <span th:if="${p.estado == 'Activo'}" class="badge bg-success">Activo</span>
                                    <span th:if="${p.estado == 'Suspendido'}" class="badge bg-danger">Suspendido</span>
                                    <span th:if="${p.estado == 'Vacaciones'}" class="badge bg-warning text-dark">Vacaciones</span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/pilotos/editar/{id}(id=${p.idPiloto})}" class="btn btn-sm btn-outline-primary me-1" title="Editar">
                                        <i class="fa-solid fa-pen-to-square"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(pilotos)}">
                                <td colspan="6" class="text-center text-muted py-4">No se encontraron pilotos registrados.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
