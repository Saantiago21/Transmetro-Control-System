<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de Buses - Transmetro Guatemala</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
    <style>
        .btn-tm-green {
            background-color: var(--tm-green);
            color: white;
            font-weight: 700;
            border: none;
            border-radius: 8px;
        }
        .btn-tm-green:hover {
            background-color: var(--tm-green-dark);
            color: white;
        }
    </style>
</head>
<body>
    <header th:replace="~{fragments/layout :: topbar}"></header>
    <aside th:replace="~{fragments/layout :: sidebar('buses')}"></aside>

    <main class="main-content">
        <section class="card-custom">
            <h5 class="fw-bold mb-3 text-dark"><i class="fa-solid fa-bus-simple me-2 text-success"></i> Registro y Gestión de Flota de Buses</h5>

            <div th:if="${error}" class="alert alert-warning py-2" role="alert" th:text="${error}"></div>
            
            <!-- Formulario de Buses (Mapeo directo robusto) -->
            <form th:action="@{/buses/guardar}" method="post" class="bg-light p-3 rounded-3 border mb-4">
                <input type="hidden" name="id" th:value="${nuevoBus != null ? nuevoBus.id : null}" />
                
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label small fw-semibold">Número de Unidad</label>
                        <input type="text" class="form-control form-control-sm" name="unidad" required maxlength="20" placeholder="Ej. TR-101" th:value="${nuevoBus != null ? nuevoBus.unidad : ''}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small fw-semibold">Placa</label>
                        <input type="text" class="form-control form-control-sm" name="placa" required maxlength="15" placeholder="Ej. C-859ABR" th:value="${nuevoBus != null ? nuevoBus.placa : ''}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small fw-semibold">Capacidad (Pasajeros)</label>
                        <input type="number" class="form-control form-control-sm" name="capacidad" required min="1" placeholder="Ej. 160" th:value="${nuevoBus != null ? nuevoBus.capacidad : ''}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small fw-semibold">Estado</label>
                        <select class="form-select form-select-sm" name="estado">
                            <option value="Operativo" th:selected="${nuevoBus != null and nuevoBus.estado == 'Operativo'}">Operativo</option>
                            <option value="En Mantenimiento" th:selected="${nuevoBus != null and nuevoBus.estado == 'En Mantenimiento'}">En Mantenimiento</option>
                            <option value="Fuera de Servicio" th:selected="${nuevoBus != null and nuevoBus.estado == 'Fuera de Servicio'}">Fuera de Servicio</option>
                        </select>
                    </div>
                </div>
                <div class="mt-3 d-flex gap-2">
                    <button type="submit" class="btn btn-tm-green btn-sm fw-bold"><i class="fa-solid fa-floppy-disk me-1"></i> Guardar Bus</button>
                    <a th:if="${modoEdicion}" th:href="@{/buses}" class="btn btn-secondary btn-sm">Cancelar</a>
                </div>
            </form>

            <!-- Tabla de Flota de Buses -->
            <div class="table-responsive">
                <table class="table align-middle table-hover">
                    <thead class="table-light small">
                        <tr>
                            <th>ID</th>
                            <th>Unidad / Placa</th>
                            <th>Capacidad</th>
                            <th>Estado</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="b : ${buses}">
                            <td class="fw-bold text-secondary" th:text="${b.id != null ? b.id : '1'}">1</td>
                            <td class="fw-bold text-success" th:text="${b.placa}">TR-101 (C-859ABR)</td>
                            <td th:text="${b.capacidad != null ? b.capacidad + ' pas.' : '120 pas.'}">160 pas.</td>
                            <td>
                                <span class="badge" 
                                      th:classappend="${b.estado == 'Operativo' or b.estado == '1'} ? 'bg-success' : 'bg-warning text-dark'" 
                                      th:text="${b.estado}">Operativo</span>
                            </td>
                            <td class="text-end">
                                <a th:href="@{/buses/editar/{id}(id=${b.id})}" class="btn btn-sm btn-outline-primary"><i class="fa-solid fa-pen"></i></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div th:replace="~{fragments/layout :: reportModal}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
